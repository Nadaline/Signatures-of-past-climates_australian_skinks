<svg xmlns="http://www.w3.org/2000/svg" width="303mm" height="216mm" viewBox="-3 -3 303 216"><rect x="-3" y="-3" width="303" height="216" fill="#FFFFFF"/><rect x="100" y="-3" width="100" height="216" fill="#F7F3FB"/><rect x="200" y="-3" width="100" height="216" fill="#FDF9EF"/><path d="M100,2L100,4" stroke="#C1B8CE" stroke-width="0.32" fill="none"/><path d="M100,206L100,208" stroke="#C1B8CE" stroke-width="0.32" fill="none"/><path d="M200,2L200,4" stroke="#C1B8CE" stroke-width="0.32" fill="none"/><path d="M200,206L200,208" stroke="#C1B8CE" stroke-width="0.32" fill="none"/><text x="8" y="13" fill="#6811DB" font-size="3" font-family="DejaVu Sans" font-weight="bold" font-style="normal">04 / SAMPLING</text><path d="M8,17L88,17" stroke="#C1B8CE" stroke-width="0.32" fill="none"/><text x="8" y="30.0" fill="#251462" font-size="6.35" font-family="DejaVu Serif" font-weight="normal" font-style="normal">From sampling</text><text x="8" y="37.4" fill="#251462" font-size="6.35" font-family="DejaVu Serif" font-weight="normal" font-style="normal">to genomics</text><text x="8" y="48.0" fill="#251462" font-size="3.6" font-family="DejaVu Sans" font-weight="normal" font-style="normal">The reference-aligned nuclear panel</text><text x="8" y="53.3" fill="#251462" font-size="3.6" font-family="DejaVu Sans" font-weight="normal" font-style="normal">contains 19,352 SNPs from 170 individuals</text><text x="8" y="58.6" fill="#251462" font-size="3.6" font-family="DejaVu Sans" font-weight="normal" font-style="normal">across 101 localities.</text><rect x="8" y="76" width="80" height="11" fill="#F7F3FB"/><rect x="8" y="76" width="1.4" height="11" fill="#6811DB"/><text x="12" y="83" fill="#251462" font-size="3.45" font-family="DejaVu Sans" font-weight="bold" font-style="normal">Geographic sampling</text><path d="M47,87L47,93" stroke="#6811DB" stroke-width="0.4" fill="none"/><rect x="8" y="94" width="80" height="11" fill="#F7F3FB"/><rect x="8" y="94" width="1.4" height="11" fill="#6811DB"/><text x="12" y="101" fill="#251462" font-size="3.45" font-family="DejaVu Sans" font-weight="bold" font-style="normal">ddRADseq</text><path d="M47,105L47,111" stroke="#6811DB" stroke-width="0.4" fill="none"/><rect x="8" y="112" width="80" height="11" fill="#F7F3FB"/><rect x="8" y="112" width="1.4" height="11" fill="#6811DB"/><text x="12" y="119" fill="#251462" font-size="3.45" font-family="DejaVu Sans" font-weight="bold" font-style="normal">Nuclear SNPs</text><path d="M47,123L47,129" stroke="#6811DB" stroke-width="0.4" fill="none"/><rect x="8" y="130" width="80" height="11" fill="#F7F3FB"/><rect x="8" y="130" width="1.4" height="11" fill="#6811DB"/><text x="12" y="137" fill="#251462" font-size="3.45" font-family="DejaVu Sans" font-weight="bold" font-style="normal">Population structure</text><path d="M47,141L47,147" stroke="#6811DB" stroke-width="0.4" fill="none"/><rect x="8" y="148" width="80" height="11" fill="#F7F3FB"/><rect x="8" y="148" width="1.4" height="11" fill="#EBB201"/><text x="12" y="155" fill="#251462" font-size="3.45" font-family="DejaVu Sans" font-weight="bold" font-style="normal">Landscape and demography</text><text x="8" y="177.0" fill="#251462" font-size="3.15" font-family="DejaVu Sans" font-weight="normal" font-style="normal">Landscape analyses used 19,131 SNPs after</text><text x="8" y="181.65" fill="#251462" font-size="3.15" font-family="DejaVu Sans" font-weight="normal" font-style="normal">excluding 221 candidates from a recoverable</text><text x="8" y="186.3" fill="#251462" font-size="3.15" font-family="DejaVu Sans" font-weight="normal" font-style="normal">RDA.</text><text x="108" y="13" fill="#6811DB" font-size="3" font-family="DejaVu Sans" font-weight="bold" font-style="normal">05 / STRUCTURE</text><path d="M108,17L188,17" stroke="#C1B8CE" stroke-width="0.32" fill="none"/><text x="108" y="30.0" fill="#251462" font-size="6.35" font-family="DejaVu Serif" font-weight="normal" font-style="normal">One species, different</text><text x="108" y="37.4" fill="#251462" font-size="6.35" font-family="DejaVu Serif" font-weight="normal" font-style="normal">genomic histories</text><text x="108" y="48.0" fill="#251462" font-size="3.6" font-family="DejaVu Sans" font-weight="normal" font-style="normal">Four genetic clusters summarize broad</text><text x="108" y="53.3" fill="#251462" font-size="3.6" font-family="DejaVu Sans" font-weight="normal" font-style="normal">structure. The elbow supported K = 4, while</text><text x="108" y="58.6" fill="#251462" font-size="3.6" font-family="DejaVu Sans" font-weight="normal" font-style="normal">numeric cross-entropy was lowest at K = 9.</text><text x="108" y="79" fill="#6811DB" font-size="3.05" font-family="DejaVu Sans" font-weight="bold" font-style="normal">MOST SAMPLED STATE WITHIN EACH GROUP</text><path d="M108,85L187,85" stroke="#C1B8CE" stroke-width="0.32" fill="none"/><circle cx="110" cy="95.8" r="1.7" fill="#6811DB" stroke="#251462" stroke-width=".25"/><text x="114" y="97" fill="#251462" font-size="3.45" font-family="DejaVu Sans" font-weight="bold" font-style="normal">K1</text><text x="126" y="97" fill="#251462" font-size="3.42" font-family="DejaVu Sans" font-weight="normal" font-style="normal">South Australia</text><rect x="126" y="102" width="36" height="1.45" fill="#DCD5E4"/><rect x="126" y="102" width="34.325581395348834" height="1.45" fill="#6811DB"/><text x="165" y="104" fill="#251462" font-size="3.05" font-family="DejaVu Sans" font-weight="normal" font-style="normal">41/43</text><circle cx="110" cy="115.8" r="1.7" fill="#06ADF1" stroke="#251462" stroke-width=".25"/><text x="114" y="117" fill="#251462" font-size="3.45" font-family="DejaVu Sans" font-weight="bold" font-style="normal">K2</text><text x="126" y="117" fill="#251462" font-size="3.42" font-family="DejaVu Sans" font-weight="normal" font-style="normal">Queensland</text><rect x="126" y="122" width="36" height="1.45" fill="#DCD5E4"/><rect x="126" y="122" width="36.0" height="1.45" fill="#06ADF1"/><text x="165" y="124" fill="#251462" font-size="3.05" font-family="DejaVu Sans" font-weight="normal" font-style="normal">11/11</text><circle cx="110" cy="135.8" r="1.7" fill="#B8D6E2" stroke="#251462" stroke-width=".25"/><text x="114" y="137" fill="#251462" font-size="3.45" font-family="DejaVu Sans" font-weight="bold" font-style="normal">K3</text><text x="126" y="137" fill="#251462" font-size="3.42" font-family="DejaVu Sans" font-weight="normal" font-style="normal">New South Wales</text><rect x="126" y="142" width="36" height="1.45" fill="#DCD5E4"/><rect x="126" y="142" width="22.5" height="1.45" fill="#B8D6E2"/><text x="165" y="144" fill="#251462" font-size="3.05" font-family="DejaVu Sans" font-weight="normal" font-style="normal">35/56</text><circle cx="110" cy="155.8" r="1.7" fill="#EBB201" stroke="#251462" stroke-width=".25"/><text x="114" y="157" fill="#251462" font-size="3.45" font-family="DejaVu Sans" font-weight="bold" font-style="normal">K4</text><text x="126" y="157" fill="#251462" font-size="3.42" font-family="DejaVu Sans" font-weight="normal" font-style="normal">New South Wales</text><rect x="126" y="162" width="36" height="1.45" fill="#DCD5E4"/><rect x="126" y="162" width="28.8" height="1.45" fill="#EBB201"/><text x="165" y="164" fill="#251462" font-size="3.05" font-family="DejaVu Sans" font-weight="normal" font-style="normal">36/45</text><text x="108" y="181.0" fill="#251462" font-size="3.13" font-family="DejaVu Sans" font-weight="normal" font-style="normal">Fractions are for individuals with Q ≥ 0.70. K3</text><text x="108" y="185.6" fill="#251462" font-size="3.13" font-family="DejaVu Sans" font-weight="normal" font-style="normal">also occurs in Victoria and Tasmania. The clusters</text><text x="108" y="190.2" fill="#251462" font-size="3.13" font-family="DejaVu Sans" font-weight="normal" font-style="normal">do not define species.</text><text x="208" y="13" fill="#6811DB" font-size="3" font-family="DejaVu Sans" font-weight="bold" font-style="normal">06 / LANDSCAPE</text><path d="M208,17L288,17" stroke="#C1B8CE" stroke-width="0.32" fill="none"/><text x="208" y="30.0" fill="#251462" font-size="6.35" font-family="DejaVu Serif" font-weight="normal" font-style="normal">What can landscapes</text><text x="208" y="37.4" fill="#251462" font-size="6.35" font-family="DejaVu Serif" font-weight="normal" font-style="normal">tell us?</text><path d="M208,45L286,45" stroke="#EBB201" stroke-width="0.65" fill="none"/><text x="208" y="52" fill="#251462" font-size="4.55" font-family="DejaVu Serif" font-weight="normal" font-style="normal">Geography</text><text x="208" y="61.0" fill="#251462" font-size="3.55" font-family="DejaVu Sans" font-weight="normal" font-style="normal">Geographic distance contributed most to</text><text x="208" y="66.1" fill="#251462" font-size="3.55" font-family="DejaVu Sans" font-weight="normal" font-style="normal">the contemporary model.</text><path d="M208,85L286,85" stroke="#EBB201" stroke-width="0.65" fill="none"/><text x="208" y="92" fill="#251462" font-size="4.55" font-family="DejaVu Serif" font-weight="normal" font-style="normal">Terrain</text><text x="208" y="101.0" fill="#251462" font-size="3.55" font-family="DejaVu Sans" font-weight="normal" font-style="normal">Topographic resistance gave a small</text><text x="208" y="106.1" fill="#251462" font-size="3.55" font-family="DejaVu Sans" font-weight="normal" font-style="normal">predictive gain under the conditional test.</text><path d="M208,125L286,125" stroke="#EBB201" stroke-width="0.65" fill="none"/><text x="208" y="132" fill="#251462" font-size="4.55" font-family="DejaVu Serif" font-weight="normal" font-style="normal">Climatic history</text><text x="208" y="141.0" fill="#251462" font-size="3.55" font-family="DejaVu Sans" font-weight="normal" font-style="normal">Past climates added modest predictive</text><text x="208" y="146.1" fill="#251462" font-size="3.55" font-family="DejaVu Sans" font-weight="normal" font-style="normal">information. Gains varied among spatial</text><text x="208" y="151.2" fill="#251462" font-size="3.55" font-family="DejaVu Sans" font-weight="normal" font-style="normal">folds.</text><text x="208" y="176.0" fill="#251462" font-size="3.35" font-family="DejaVu Sans" font-weight="normal" font-style="normal">Genomic differentiation across eastern</text><text x="208" y="180.9" fill="#251462" font-size="3.35" font-family="DejaVu Sans" font-weight="normal" font-style="normal">Australia cannot be reduced to one factor.</text><text x="208" y="185.8" fill="#251462" font-size="3.35" font-family="DejaVu Sans" font-weight="normal" font-style="normal">Association does not establish selection or</text><text x="208" y="190.7" fill="#251462" font-size="3.35" font-family="DejaVu Sans" font-weight="normal" font-style="normal">causation.</text></svg>
